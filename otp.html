<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - DigiBridge</title>
    <link rel="stylesheet" href="stylesheet.css" />
    <link rel="stylesheet" href="otp.css" />
  </head>
  <body>
    <div class="form-wrap">
      <h2 class="form-title">Verify OTP 🔐</h2>
      <p class="form-sub" id="otp-sub">
        Enter the 6-digit code sent to your email.
      </p>

      <div class="face-wrap">
        <svg
          id="face"
          width="100"
          height="100"
          viewBox="0 0 110 110"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <radialGradient id="faceGrad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#5a5a5a" />
              <stop offset="100%" stop-color="#1a1a1a" />
            </radialGradient>
            <radialGradient id="happyGrad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#FFE066" />
              <stop offset="100%" stop-color="#FFD93D" />
            </radialGradient>
            <radialGradient id="sadGrad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#a0c4ff" />
              <stop offset="100%" stop-color="#4a90d9" />
            </radialGradient>
          </defs>
          <circle
            id="face-circle"
            cx="55"
            cy="55"
            r="50"
            fill="url(#faceGrad)"
          />
          <g id="angry-brows" opacity="0">
            <line
              x1="22"
              y1="32"
              x2="46"
              y2="40"
              stroke="white"
              stroke-width="4"
              stroke-linecap="round"
            />
            <line
              x1="64"
              y1="40"
              x2="88"
              y2="32"
              stroke="white"
              stroke-width="4"
              stroke-linecap="round"
            />
          </g>
          <g id="happy-brows" opacity="0">
            <path
              d="M 28 36 Q 38 28 48 34"
              stroke="#b8860b"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
            <path
              d="M 62 34 Q 72 28 82 36"
              stroke="#b8860b"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
          </g>
          <ellipse id="eye-left" cx="37" cy="45" rx="7" ry="8" fill="white" />
          <ellipse id="eye-right" cx="73" cy="45" rx="7" ry="8" fill="white" />
          <ellipse
            id="pupil-left"
            cx="37"
            cy="46"
            rx="4"
            ry="4.5"
            fill="#111"
          />
          <ellipse
            id="pupil-right"
            cx="73"
            cy="46"
            rx="4"
            ry="4.5"
            fill="#111"
          />
          <ellipse
            cx="39"
            cy="43"
            rx="1.5"
            ry="1.5"
            fill="white"
            opacity="0.7"
          />
          <ellipse
            cx="75"
            cy="43"
            rx="1.5"
            ry="1.5"
            fill="white"
            opacity="0.7"
          />
          <path
            id="mouth"
            d="M 38 70 Q 55 65 72 70"
            stroke="white"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
          <ellipse
            id="blush-l"
            cx="22"
            cy="65"
            rx="10"
            ry="6"
            fill="#FF9999"
            opacity="0"
          />
          <ellipse
            id="blush-r"
            cx="88"
            cy="65"
            rx="10"
            ry="6"
            fill="#FF9999"
            opacity="0"
          />
        </svg>
      </div>

      <div class="otp-inputs">
        <input type="text" maxlength="1" class="otp-box" id="o1" />
        <input type="text" maxlength="1" class="otp-box" id="o2" />
        <input type="text" maxlength="1" class="otp-box" id="o3" />
        <input type="text" maxlength="1" class="otp-box" id="o4" />
        <input type="text" maxlength="1" class="otp-box" id="o5" />
        <input type="text" maxlength="1" class="otp-box" id="o6" />
      </div>

      <div class="msg" id="msg"></div>
      <button id="verify-btn">Verify OTP</button>

      <div class="timer" id="timer">
        Code expires in: <span id="countdown">05:00</span>
      </div>

      <div class="resend">
        Didn't receive it? <a onclick="resendOTP()">Resend OTP</a>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
    >
      </script
         <script src="otp.js">
    </script>
  </body>
</html>
