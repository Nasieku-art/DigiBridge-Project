<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Digibridge</title>

    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div class="form-wrap">
      <h2 class="form-title">Create Account 🎓</h2>

      <div class="face-wrap">
        <svg
          id="face"
          width="110"
          height="110"
          viewBox="0 0 110 110"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <radialGradient id="faceGrad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#5a5a5a" />
              <stop offset="100%" stop-color="#1a1a1a" />
            </radialGradient>
            <radialGradient id="happyGrad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#FFE066" />
              <stop offset="100%" stop-color="#FFD93D" />
            </radialGradient>
            <radialGradient id="sadGrad" cx="40%" cy="35%" r="60%">
              <stop offset="0%" stop-color="#a0c4ff" />
              <stop offset="100%" stop-color="#4a90d9" />
            </radialGradient>
          </defs>

          <circle
            id="face-circle"
            cx="55"
            cy="55"
            r="50"
            fill="url(#faceGrad)"
          />

          <g id="angry-brows" opacity="0">
            <line
              x1="22"
              y1="32"
              x2="46"
              y2="40"
              stroke="white"
              stroke-width="4"
              stroke-linecap="round"
            />
            <line
              x1="64"
              y1="40"
              x2="88"
              y2="32"
              stroke="white"
              stroke-width="4"
              stroke-linecap="round"
            />
          </g>
          <g id="sad-brows" opacity="0">
            <path
              d="M 26 38 Q 36 32 46 38"
              stroke="#1a4a7a"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
            <path
              d="M 64 38 Q 74 32 84 38"
              stroke="#1a4a7a"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
          </g>
          <g id="happy-brows" opacity="0">
            <path
              d="M 28 36 Q 38 28 48 34"
              stroke="#b8860b"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
            <path
              d="M 62 34 Q 72 28 82 36"
              stroke="#b8860b"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
          </g>

          <ellipse id="eye-left" cx="37" cy="45" rx="7" ry="8" fill="white" />
          <ellipse id="eye-right" cx="73" cy="45" rx="7" ry="8" fill="white" />
          <ellipse
            id="pupil-left"
            cx="37"
            cy="46"
            rx="4"
            ry="4.5"
            fill="#111"
          />
          <ellipse
            id="pupil-right"
            cx="73"
            cy="46"
            rx="4"
            ry="4.5"
            fill="#111"
          />
          <ellipse
            cx="39"
            cy="43"
            rx="1.5"
            ry="1.5"
            fill="white"
            opacity="0.7"
          />
          <ellipse
            cx="75"
            cy="43"
            rx="1.5"
            ry="1.5"
            fill="white"
            opacity="0.7"
          />

          <ellipse
            id="tear-left"
            cx="33"
            cy="58"
            rx="3"
            ry="4"
            fill="#a0d4ff"
            opacity="0"
          />
          <ellipse
            id="tear-right"
            cx="69"
            cy="58"
            rx="3"
            ry="4"
            fill="#a0d4ff"
            opacity="0"
          />

          <path
            id="mouth"
            d="M 38 70 Q 55 65 72 70"
            stroke="white"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />

          <ellipse
            id="blush-l"
            cx="22"
            cy="65"
            rx="10"
            ry="6"
            fill="#FF9999"
            opacity="0"
          />
          <ellipse
            id="blush-r"
            cx="88"
            cy="65"
            rx="10"
            ry="6"
            fill="#FF9999"
            opacity="0"
          />
        </svg>
      </div>

      <div class="field">
        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="e.g. Uncle PamPam" />
      </div>

      <div class="field">
        <label>Sign up with</label>
        <div style="display: flex; gap: 8px; margin-bottom: 8px">
          <button
            type="button"
            id="tab-email"
            onclick="switchTab('email')"
            style="
              flex: 1;
              padding: 8px;
              border-radius: 8px;
              border: 1px solid rgb(0, 213, 255);
              background: rgb(0, 213, 255);
              color: #000;
              font-weight: 600;
              cursor: pointer;
              font-family: sans-serif;
            "
          >
            Email
          </button>
          <button
            type="button"
            id="tab-phone"
            onclick="switchTab('phone')"
            style="
              flex: 1;
              padding: 8px;
              border-radius: 8px;
              border: 1px solid #444;
              background: #1a1a1a;
              color: #aaa;
              cursor: pointer;
              font-family: sans-serif;
            "
          >
            Phone
          </button>
        </div>
        <div id="email-field">
          <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div id="phone-field" style="display: none">
          <input type="tel" id="phone" placeholder="+254 7XX XXX XXX" />
        </div>
      </div>

      <div class="field">
        <label>Password <span class="hint">(min 8 characters)</span></label>
        <input type="password" id="password" placeholder="Enter password" />
      </div>

      <div class="msg" id="msg"></div>
      <button id="submit-btn">Sign Up & Get OTP</button>

      <div class="bottom-links">
        <p>Already have an account? <a href="login.html">Login</a></p>
        <p style="margin-top: 6px"><a href="index.html">← Back to Home</a></p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="signup.js"></script>
  </body>
</html>
